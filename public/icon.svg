<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="teal-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bg-grad)" />
  
  <!-- Outer Subtle Ring -->
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.2" />

  <!-- Ambient Light Center -->
  <circle cx="256" cy="230" r="180" fill="url(#aura)" />

  <!-- Crescent Moon Symbol in Background -->
  <path d="M 290 130 A 100 100 0 1 0 350 290 A 85 85 0 1 1 290 130 Z" fill="url(#teal-glow)" opacity="0.3" />

  <!-- Star of guidance -->
  <polygon points="340,165 344,175 355,175 346,182 349,192 340,186 331,192 334,182 325,175 336,175" fill="url(#gold-accent)" opacity="0.9" />

  <!-- Central Open Quran Icon -->
  <g filter="url(#shadow)" transform="translate(256, 260)">
    <!-- Book Spine / Base -->
    <path d="M -130 50 C -60 30, -20 50, 0 65 C 20 50, 60 30, 130 50 L 130 -40 C 60 -60, 20 -40, 0 -25 C -20 -40, -60 -60, -130 -40 Z" fill="#0f172a" stroke="url(#teal-glow)" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Left Page Layers -->
    <path d="M -125 -32 C -60 -52, -20 -32, 0 -17 L 0 57 C -20 42, -60 22, -125 42 Z" fill="#134e4a" opacity="0.6" />
    <path d="M -120 -24 C -60 -44, -20 -24, 0 -9 L 0 49 C -20 34, -60 14, -120 34 Z" fill="#f8fafc" />

    <!-- Right Page Layers -->
    <path d="M 125 -32 C 60 -52, 20 -32, 0 -17 L 0 57 C 20 42, 60 22, 125 42 Z" fill="#134e4a" opacity="0.6" />
    <path d="M 120 -24 C 60 -44, 20 -24, 0 -9 L 0 49 C 20 34, 60 14, 120 34 Z" fill="#f8fafc" />

    <!-- Page Text Lines Representation (Left Page) -->
    <line x1="-95" y1="-14" x2="-25" y2="-5" stroke="#0d9488" stroke-width="3" stroke-linecap="round" />
    <line x1="-100" y1="2" x2="-25" y2="10" stroke="#0d9488" stroke-width="3" stroke-linecap="round" />
    <line x1="-90" y1="18" x2="-25" y2="25" stroke="#0d9488" stroke-width="3" stroke-linecap="round" />

    <!-- Page Text Lines Representation (Right Page) -->
    <line x1="25" y1="-5" x2="95" y2="-14" stroke="#0d9488" stroke-width="3" stroke-linecap="round" />
    <line x1="25" y1="10" x2="100" y2="2" stroke="#0d9488" stroke-width="3" stroke-linecap="round" />
    <line x1="25" y1="25" x2="90" y2="18" stroke="#0d9488" stroke-width="3" stroke-linecap="round" />

    <!-- Golden Spine Ribbon Marker -->
    <path d="M 0 -22 L 0 85 L 10 95 L 0 90 L -10 95 L 0 85 Z" fill="url(#gold-accent)" />

    <!-- Soundwaves / Audio Arc (Quran Audio Player) -->
    <path d="M -60 -75 A 75 75 0 0 1 60 -75" fill="none" stroke="url(#gold-accent)" stroke-width="5" stroke-linecap="round" />
    <path d="M -90 -95 A 110 110 0 0 1 90 -95" fill="none" stroke="url(#teal-glow)" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Nooraya Brand Wordmark in Icon -->
  <text x="256" y="445" font-family="'Amiri', 'Playfair Display', serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">NOORAYA</text>
  <text x="256" y="475" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#2dd4bf" text-anchor="middle" letter-spacing="3">QURAN AUDIO</text>
</svg>
